<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pokedex</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1B1F2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><span class="mark"></span><h1>Pokedex</h1></div>
    <p class="subtitle">Consulta quién le gana a quién</p>
  </header>

  <div class="mode-switch">
    <div class="toggle toggle-3" id="modeToggle" data-active="0">
      <div class="slider"></div>
      <button class="active" data-mode="pokemon">Por Pokémon</button>
      <button data-mode="tipo">Por Tipo</button>
      <button data-mode="equipo">Mi Equipo</button>
    </div>
  </div>

  <!-- ======================= MODO: POR POKEMON ======================= -->
  <div id="view-pokemon">

    <div class="search-wrap">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="pokeSearchInput" placeholder="Busca un Pokémon (nombre o número)…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Buscar Pokémon por nombre o número">
        <button type="button" id="clearSearchBtn" class="clear-btn" style="display:none;" aria-label="Limpiar búsqueda">✕</button>
      </div>
      <div class="suggestions" id="pokeSuggestions" style="display:none;"></div>
      <div class="search-hint">Nombre o #número (ej. #25)</div>
    </div>

    <div id="favRow" class="fav-row" style="display:none;">
      <div class="fav-row-label">★ Favoritos</div>
      <div class="fav-chips" id="favChips"></div>
    </div>

    <div id="pokeResultZone"></div>

  </div>

  <!-- ======================= MODO: POR TIPO ======================= -->
  <div id="view-tipo" style="display:none;">

    <div class="toggle-wrap">
      <div class="toggle" id="toggle">
        <div class="slider"></div>
        <button class="active" data-mode="simple">Simple <span class="pill-count">1 tipo</span></button>
        <button data-mode="complex">Complejo <span class="pill-count">2 tipos</span></button>
      </div>
    </div>

    <div class="section-label" id="hexLabel">Elige un tipo</div>
    <div class="hexgrid" id="hexgrid">
      <div class="hex t-fuego" data-type="fuego" role="button" tabindex="0">Fuego</div>
      <div class="hex t-agua" data-type="agua" role="button" tabindex="0">Agua</div>
      <div class="hex t-planta" data-type="planta" role="button" tabindex="0">Planta</div>
      <div class="hex t-electrico" data-type="electrico" role="button" tabindex="0">Eléctrico</div>
      <div class="hex t-hielo" data-type="hielo" role="button" tabindex="0">Hielo</div>
      <div class="hex t-lucha" data-type="lucha" role="button" tabindex="0">Lucha</div>
      <div class="hex t-veneno" data-type="veneno" role="button" tabindex="0">Veneno</div>
      <div class="hex t-tierra" data-type="tierra" role="button" tabindex="0">Tierra</div>
      <div class="hex t-volador" data-type="volador" role="button" tabindex="0">Volador</div>
      <div class="hex t-psiquico" data-type="psiquico" role="button" tabindex="0">Psíquico</div>
      <div class="hex t-bicho" data-type="bicho" role="button" tabindex="0">Bicho</div>
      <div class="hex t-roca" data-type="roca" role="button" tabindex="0">Roca</div>
      <div class="hex t-fantasma" data-type="fantasma" role="button" tabindex="0">Fantasma</div>
      <div class="hex t-dragon" data-type="dragon" role="button" tabindex="0">Dragón</div>
      <div class="hex t-siniestro" data-type="siniestro" role="button" tabindex="0">Siniestro</div>
      <div class="hex t-acero" data-type="acero" role="button" tabindex="0">Acero</div>
      <div class="hex t-hada" data-type="hada" role="button" tabindex="0">Hada</div>
      <div class="hex t-normal" data-type="normal" role="button" tabindex="0">Normal</div>
    </div>

    <div id="complex-view" style="display:none;">
      <div class="combo-row">
        <div class="combo-slot" id="comboSlot1">Tipo 1</div>
        <div class="combo-plus">+</div>
        <div class="combo-slot" id="comboSlot2">Tipo 2</div>
      </div>
    </div>

    <div id="typeResultZone"></div>

  </div>

  <!-- ======================= MODO: MI EQUIPO ======================= -->
  <div id="view-team" style="display:none;">

    <div class="section-label" id="teamLabel">Mi equipo (0/6)</div>
    <div class="team-grid" id="teamGrid"></div>

    <div id="teamAnalysis"></div>

  </div>

</div>

<!-- Modal para añadir un Pokémon a una celda del equipo -->
<div id="teamAddModal" class="team-modal" style="display:none;">
  <div class="team-modal-backdrop" id="teamModalBackdrop"></div>
  <div class="team-modal-panel">
    <div class="team-modal-header">
      <span>Añadir a tu equipo</span>
      <button type="button" id="teamModalClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="search-box">
      <input type="text" id="teamModalInput" placeholder="Busca un Pokémon…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Buscar Pokémon para añadir al equipo">
    </div>
    <div class="suggestions team-modal-suggestions" id="teamModalSuggestions" style="display:none;"></div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/matchup-engine.js"></script>
<script src="js/pokemon-view.js"></script>
<script src="js/evolution-view.js"></script>
<script src="js/search-autocomplete.js"></script>
<script src="js/types-view.js"></script>
<script src="js/team-view.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('No se pudo registrar el Service Worker:', err);
      });
    });
  }
</script>

</body>
</html>
